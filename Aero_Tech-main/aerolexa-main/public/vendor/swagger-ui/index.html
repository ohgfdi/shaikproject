<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ledgerly API Docs</title>
    <link rel="stylesheet" href="/vendor/swagger-ui/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fff; }
      #swagger .topbar { display: none; }
    </style>
  </head>
  <body>
    <div id="swagger"></div>
    <script src="/vendor/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="/vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        window.ui = SwaggerUIBundle({
          url: "/api/public/openapi.json",
          dom_id: "#swagger",
          deepLinking: true,
          persistAuthorization: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout"
        });
      });
    </script>
  </body>
</html>
