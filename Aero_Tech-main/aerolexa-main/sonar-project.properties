{
  "$schema": "https://raw.githubusercontent.com/SonarSource/sonarqube/develop/sonar-project.properties",
  "sonar.projectKey": "Ledgerly",
  "sonar.organization": "Ledgerly",
  "sonar.sources": "app,components,lib",
  "sonar.tests": "__tests__",
  "sonar.test.inclusions": "**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx",
  "sonar.exclusions": "**/node_modules/**,**/.next/**,**/*.mjs,**/migrations/**,**/prisma/**,**/docs/**",
  "sonar.sourceEncoding": "UTF-8",
  "sonar.javascript.lcov.reportPaths": "coverage/lcov.info"
}
