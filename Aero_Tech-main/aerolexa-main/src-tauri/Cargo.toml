[package]
name = "ledgerly"
version = "0.6.1"
description = "Ledgerly — from raw data to boardroom decisions. Data-driven analytics workspace for CA firms, consultants & SMBs."
authors = ["Ledgerly Maintainers"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "ledgerly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
