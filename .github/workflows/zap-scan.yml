name: ZAP baseline scan

# Root-level copy: GitHub only runs workflows from `.github/workflows` at the
# repository root, so the previous location inside the app subdirectory meant
# this scan never executed. `docker compose` and the app both live in
# `Aero_Tech-main/aerolexa-main`, hence the workflow default below.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC — weekly enough for a DAST pass

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Aero_Tech-main/aerolexa-main

jobs:
  zap:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Boot the app (Docker compose, SQLite profile)
        run: |
          # AUTH_SECRET must be 32+ hex-ish chars; compose default is dev-only.
          export AUTH_SECRET="zap-scan-secret-0123456789abcdef0123456789abcdef"
          docker compose up --build -d
          # Wait for the app's own readiness probe before scanning.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "app is ready"; exit 0
            fi
            sleep 2
          done
          echo "app never became healthy"; docker compose logs --tail 100; exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a -I -r zap-report.html -w zap-warnings.md"
          # Fail on HIGH-severity alerts only at first (Medium noise like
          # missing CSP on static assets is triaged once a baseline exists).
          fail_action: true
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            Aero_Tech-main/aerolexa-main/zap-report.html
            Aero_Tech-main/aerolexa-main/zap-warnings.md
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
